name: CD (build artifacts)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (server)
        run: npm ci
        working-directory: server

      - name: Build (server)
        run: npm run build:prod
        working-directory: server

      - name: Install (frontend)
        run: npm ci
        working-directory: frontend

      - name: Build (frontend)
        run: npm run build
        working-directory: frontend

      - name: Archive artifacts
        run: |
          mkdir -p out
          tar -czf out/server-dist.tgz -C server dist package.json package-lock.json prisma
          tar -czf out/frontend-dist.tgz -C frontend dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: facturio-build-${{ github.ref_name }}
          path: out/*.tgz

