name: CD (build artifacts)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (server)
        run: npm ci
        working-directory: server

      - name: Generate Prisma client (prod schema)
        run: npx prisma generate --schema=prisma/postgresql/schema.prisma
        working-directory: server

      - name: Server tests (unit + e2e)
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: Build (server)
        run: npm run build:prod
        working-directory: server

      - name: Install (frontend)
        run: npm ci
        working-directory: frontend

      - name: Production env (Vite)
        run: cp env.prod.example .env.production
        working-directory: frontend

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Build (frontend)
        run: npm run build
        working-directory: frontend

      - name: Archive artifacts
        run: |
          mkdir -p out
          tar -czf out/server-dist.tgz -C server dist package.json package-lock.json prisma
          tar -czf out/frontend-dist.tgz -C frontend dist

      # ref_name peut contenir des / (branche) — interdit dans upload-artifact@v4
      - name: Nom d'artefact (sans /)
        id: artifact
        shell: bash
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          echo "name=facturio-build-${safe}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: out/*.tgz

