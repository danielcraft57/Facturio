name: Server Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/facturio-server:latest
            ghcr.io/${{ github.repository_owner }}/facturio-server:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}/facturio-server:main', github.repository_owner) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/facturio-server:{1}', github.repository_owner, github.ref_name) || '' }}
