name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-unit:
    name: server (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: Finance module unit tests (créances & dettes)
        run: npm run test:unit:finance
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: Build
        run: npm run build

  server-e2e:
    name: server (e2e)
    needs: server-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Prepare test database
        run: npm run pretest:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: Finance module E2E (créances & dettes)
        run: npm run test:e2e:finance
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

  frontend-lint:
    name: frontend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

  frontend-test:
    name: frontend (test)
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

  frontend-build:
    name: frontend (build)
    needs: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Production env (Vite)
        run: cp env.prod.example .env.production

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_APP_URL: ${{ secrets.FACTURIO_PUBLIC_APP_URL }}

      - name: Upload frontend dist (déploiement Pi sans build local)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 30
          if-no-files-found: error

  ci-success:
    name: ci (gate)
    needs: [server-e2e, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI OK — prêt pour tag v* et CD"
