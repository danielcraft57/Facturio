# Snippet PostgreSQL — Facturio (VPS ~2 Go RAM, charge modérée)
# Installation :
#   sudo cp scripts/deploy/postgresql/facturio-tuning.conf /etc/postgresql/16/main/conf.d/99-facturio.conf
#   sudo systemctl restart postgresql
# Adapter la version (14, 15, 16…) selon `pg_config --version`.

# Mémoire
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB

# Connexions (Prisma pool ~8 + marge admin)
max_connections = 50

# WAL / disque (SSD)
wal_compression = on
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

# Requêtes
default_statistics_target = 100
jit = off

# Logs utiles prod (sans tout verbose)
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on

# Locale / temps
timezone = 'UTC'
lc_messages = 'C'
