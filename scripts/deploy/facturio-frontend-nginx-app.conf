# Nginx : frontend Facturio sur le serveur applicatif (port 5173).
# Fichier de reference. Deployer vers /etc/nginx/sites-available/facturio-frontend
# et activer : sudo ln -sf .../facturio-frontend /etc/nginx/sites-enabled/
server {
    listen 5173;
    server_name localhost;
    root /opt/facturio/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control public;
    }

    access_log /var/log/nginx/facturio_frontend_access.log;
    error_log /var/log/nginx/facturio_frontend_error.log;
}
