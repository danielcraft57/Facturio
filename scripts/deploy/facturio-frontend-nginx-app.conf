# Nginx local sur le Pi — fichiers statiques (dist). Le reverse proxy public est sur node12.lan.
server {
    listen 5173;
    listen [::]:5173;
    server_name localhost raspberry-10.lan raspberry-10;

    root /opt/facturio/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/facturio_frontend_access.log;
    error_log /var/log/nginx/facturio_frontend_error.log;
}
