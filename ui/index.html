<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facturio - Thèmes</title>
  <link rel="stylesheet" href="theme-base.css" />
  <link id="theme-link" rel="stylesheet" href="theme-minimal-pro.css" />
  <style>
    .theme-switcher { display:flex; align-items:center; gap:12px; }
    .theme-switcher select { height:36px; padding:0 8px; border-radius:8px; border:1px solid #E5E7EB; background:#fff; }
  </style>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <strong>Facturio</strong>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#6B7280" aria-hidden="true"><path d="M21 21l-4.3-4.3" stroke="#6B7280" stroke-width="2" stroke-linecap="round"></path><circle cx="11" cy="11" r="7" stroke="#6B7280" stroke-width="2" fill="none"/></svg>
        <input placeholder="Rechercher devis, factures, clients..." />
      </div>
      <div class="theme-switcher">
        <label for="theme">Theme:</label>
        <select id="theme">
          <option value="theme-minimal-pro.css">Minimal Pro (clair)</option>
          <option value="theme-moderne-chaleureux.css">Moderne chaleureux (clair)</option>
          <option value="theme-energique.css">Energique (clair)</option>
          <option value="theme-business-dark.css">Business sombre (dark)</option>
        </select>
        <button class="btn btn--primary" onclick="alert('Action principale')">Action</button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="nav">
        <a href="#" class="active">Devis</a>
        <a href="#">Factures</a>
        <a href="#">Clients</a>
        <a href="#">Paiements</a>
        <a href="#">Compta</a>
        <a href="#">Parametres</a>
      </nav>
    </aside>

    <main class="content">
      <div class="card" style="padding:0;">
        <table class="table">
          <thead>
            <tr>
              <th>N°</th>
              <th>Client</th>
              <th>Montant</th>
              <th>Statut</th>
              <th>Envoye</th>
              <th style="width:1%;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Q-2025-0123</td>
              <td>ACME</td>
              <td>1 250,00 €</td>
              <td><span class="chip chip--sent">Envoye</span></td>
              <td>12/08/2025</td>
              <td><button class="btn btn--ghost">Ouvrir</button></td>
            </tr>
            <tr>
              <td>Q-2025-0122</td>
              <td>Globex</td>
              <td>890,00 €</td>
              <td><span class="chip chip--accepted">Accepte</span></td>
              <td>09/08/2025</td>
              <td><button class="btn btn--ghost">Ouvrir</button></td>
            </tr>
            <tr>
              <td>Q-2025-0121</td>
              <td>Initech</td>
              <td>2 040,00 €</td>
              <td><span class="chip chip--viewed">Vu</span></td>
              <td>07/08/2025</td>
              <td><button class="btn btn--ghost">Ouvrir</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const select = document.getElementById('theme');
    const link = document.getElementById('theme-link');
    select.addEventListener('change', () => { link.href = select.value; });
  </script>
</body>
</html>
